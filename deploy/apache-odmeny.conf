RedirectMatch 301 ^/odmeny$ /odmeny/
Alias /odmeny/ /var/www/odmeny/

<Directory /var/www/odmeny>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
    SetEnv ODMENY_DATA_DIR /var/lib/odmeny

    # Z webu jsou vidět jen index.php, api.php, app.php a soubory ve static/.
    <FilesMatch "(^\.|\.(md|txt|zip|py|sh|ini|json|sqlite3|lock|log|bak|conf)$)">
        Require all denied
    </FilesMatch>
    <Files "dev-router.php">
        Require all denied
    </Files>

    # Statické soubory (skripty, styly, písma) servíruje Apache sám; i ony dostanou
    # ochranné hlavičky. PHP stránky si je nastavují samy (lib/odmeny.php).
    <IfModule mod_headers.c>
        <FilesMatch "\.(js|css|woff2|svg|png|ico)$">
            Header set X-Content-Type-Options "nosniff"
            Header set Referrer-Policy "no-referrer"
            Header set Cross-Origin-Resource-Policy "same-origin"
        </FilesMatch>
    </IfModule>

    # Šifrovaná data přicházejí jako jeden blok (nejvýš 12 MB v base64).
    <IfModule php_module>
        php_value post_max_size 24M
        php_value upload_max_filesize 2M
        php_value memory_limit 256M
    </IfModule>
</Directory>

# Kód aplikace (private/) vydává jen app.php po odemčení. Knihovny, nástroje,
# testy, data a skryté adresáře se z webu nečtou vůbec.
<DirectoryMatch "^/var/www/odmeny/(\.[^/]*|data|lib|bin|private|tests|deploy)(/|$)">
    Require all denied
</DirectoryMatch>

<Directory /var/lib/odmeny>
    Require all denied
</Directory>
